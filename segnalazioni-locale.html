<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Pagina interna: fuori dai motori di ricerca. -->
  <meta name="robots" content="noindex, nofollow">
  <title>Segnalazioni</title>
  <meta name="theme-color" content="#3d1f0f">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/icon-32x32.png">
  <link rel="apple-touch-icon" href="./assets/icons/icon-152x152.png">
  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Rye&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    [hidden] { display: none !important; }

    /* Aspetto del menu principale (pergamena, legno, Pirata One): questa
       pagina si apre da lì ed è di tutti. Quella dei vini (segnalazioni.html)
       resta blu, come l'area vini da cui si apre. */
    body {
      font-family: 'Georgia', serif;
      background: linear-gradient(rgba(20, 40, 60, 0.40), rgba(20, 40, 60, 0.40)), url('./assets/images/SfondoVD.png');
      background-size: cover; background-position: center; background-attachment: fixed;
      color: #2c1810; min-height: 100vh; padding: 20px;
    }
    .container { max-width: 900px; margin: 0 auto; }

    /* Testata con la geometria di prenotazioni.html. */
    .header {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      margin-bottom: 20px; padding: 20px;
      background: rgba(35, 55, 80, 0.85); border: 3px solid #d4a574; border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .header h1 {
      font-family: 'Pirata One', cursive; font-weight: 400; font-size: 2em; color: #d4a574;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
    }
    .btn-home {
      background: linear-gradient(145deg, #e8b873 0%, #c89858 100%); color: #2c1810;
      padding: 8px 20px; border: 2px solid #8b4513; border-radius: 8px; font-size: 1.15em;
      box-shadow: 0 5px 0 #6b3410, 0 7px 10px rgba(0,0,0,0.6), inset 0 2px 0 rgba(255,255,255,0.4);
      text-decoration: none; display: inline-flex; align-items: center; white-space: nowrap;
      font-family: 'Pirata One', cursive; transition: all 0.15s;
    }
    .btn-home:hover { background: linear-gradient(145deg, #f4c489 0%, #d4a874 100%); transform: translateY(-2px); }
    .btn-home:active { transform: translateY(4px); box-shadow: 0 1px 0 #6b3410, 0 3px 6px rgba(0,0,0,0.5); }

    /* Icone: sprite SVG inline (MANUALE §9). */
    .ico {
      width: 1.3em; height: 1.3em; fill: currentColor;
      vertical-align: -0.28em; flex-shrink: 0; margin-right: 0.3em;
    }
    .ico-sola { margin-right: 0; }
    .btn-home .ico {
      width: 1.75em; height: 1.75em; vertical-align: -0.44em;
      stroke: currentColor; stroke-width: 12; paint-order: stroke fill;
    }
    .header h1 .ico { width: 1.5em; height: 1.5em; vertical-align: -0.35em; margin-right: 0.2em; }

    /* Pergamena come i riquadri del menu principale. */
    .section {
      background: linear-gradient(145deg, #d4a574 0%, #a67c52 100%);
      border: 4px solid #6b4423; border-radius: 15px;
      padding: 24px; margin-bottom: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .section-title {
      font-family: 'Pirata One', cursive; font-size: 1.7em; color: #3d1f0f;
      margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
      text-shadow: 1px 1px 0 rgba(255,255,255,0.25);
    }

    label {
      display: block; font-family: 'Rye', cursive; font-size: 0.95em; color: #2c1810; margin-bottom: 6px;
    }
    input[type="text"], input[type="search"], select, textarea {
      width: 100%; padding: 11px 12px; border: 3px solid #6b4423; border-radius: 8px;
      font-family: 'Georgia', serif; font-size: 1em; background: #f4e4c1; color: #2c1810;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #3d1f0f; background: #fbf1da; }
    textarea { min-height: 80px; resize: vertical; }

    .scelte { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .chip {
      display: inline-flex; align-items: center; cursor: pointer; position: relative;
      padding: 8px 16px; border: 3px solid #6b4423; border-radius: 22px;
      background: #f4e4c1; color: #3d1f0f; font-family: 'Pirata One', cursive; font-size: 1.2em;
      transition: all 0.15s;
    }
    .chip input { position: absolute; opacity: 0; width: 0; height: 0; }
    .chip:has(input:checked) { background: #3d1f0f; border-color: #3d1f0f; color: #f4e4c1; }
    .chip:focus-within { outline: 2px solid #f4e4c1; outline-offset: 2px; }

    .riga-campi { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
    .urgente-scelta {
      display: flex; align-items: center; gap: 10px; margin-top: 16px; cursor: pointer;
      font-family: 'Rye', cursive; color: #8b0000; font-size: 1.05em;
    }
    .urgente-scelta input { width: 22px; height: 22px; accent-color: #8b0000; cursor: pointer; }
    .azioni { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 18px; }

    .btn {
      padding: 12px 24px; border: 3px solid #3d1f0f; border-radius: 8px; cursor: pointer;
      font-family: 'Pirata One', cursive; font-size: 1.35em; letter-spacing: 0.5px;
      display: inline-flex; align-items: center; transition: all 0.15s;
      box-shadow: 0 4px 0 #3d1f0f, 0 8px 20px rgba(0,0,0,0.4);
    }
    .btn:active { transform: translateY(4px); box-shadow: 0 0 0 #3d1f0f, 0 4px 10px rgba(0,0,0,0.4); }
    .btn-primario { background: linear-gradient(145deg, #8b4513 0%, #654321 100%); color: #f4e4c1; }
    .btn-primario:hover { background: linear-gradient(145deg, #a0522d 0%, #7a3e1e 100%); }
    .btn-secondario { background: linear-gradient(145deg, #e8b873 0%, #c89858 100%); color: #2c1810; }
    .btn-secondario:hover { background: linear-gradient(145deg, #f0c890 0%, #d4a574 100%); }
    .btn-mini {
      padding: 7px 10px; border-radius: 6px; cursor: pointer; margin-left: 4px;
      background: #f4e4c1; color: #3d1f0f; border: 2px solid #6b4423;
    }
    .btn-mini:hover { background: #fbf1da; }
    .btn-mini.pericolo { color: #8b0000; border-color: #8b0000; }

    .contatori { font-family: 'Rye', cursive; color: #3d1f0f; margin: 4px 0 12px; font-size: 0.95em; }

    /* Riga: bordo del colore della categoria, come le schede vini. */
    .voce {
      display: flex; gap: 10px; align-items: flex-start; background: #f4e4c1;
      border: 2px solid #6b4423; border-left: 7px solid var(--cat-color, #6b4423);
      border-radius: 10px; padding: 12px 14px; margin-bottom: 10px;
    }
    .voce-food      { --cat-color: #b35a00; }
    .voce-strumenti { --cat-color: #4a5a6a; }
    .voce-drink     { --cat-color: #1a6a9a; }
    .voce-vino      { --cat-color: #7a1022; }
    .voce-altro     { --cat-color: #6b4423; }
    .voce.urgente { background: #fde3d6; border-color: #8b0000; box-shadow: 0 0 0 2px #8b0000 inset; }
    .voce.chiusa { background: #e9dcc0; --cat-color: #b4a58a; opacity: 0.85; }
    .voce-corpo { flex: 1; min-width: 0; }
    .voce-testo { font-size: 1.05em; font-weight: bold; color: #2c1810; line-height: 1.4; overflow-wrap: anywhere; }
    .voce.chiusa .voce-testo { text-decoration: line-through; font-weight: normal; color: #6b5a44; }
    .voce-sotto { font-size: 0.85em; color: #5a4632; margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .badge {
      display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 10px;
      font-family: 'Pirata One', cursive; font-size: 1.1em; color: #fff; background: var(--cat-color, #6b4423);
    }
    .badge-urgente { background: #8b0000; }

    .messaggio { padding: 12px; border-radius: 8px; font-weight: bold; text-align: center; margin-top: 14px; }
    .messaggio.errore { background: #ffcccc; color: #8b0000; border: 2px solid #8b0000; }
    .messaggio.ok { background: #dcedc8; color: #33691e; border: 2px solid #558b2f; }
    .vuoto { text-align: center; padding: 24px; color: #3d1f0f; font-style: italic; }

    .velo {
      position: fixed; inset: 0; background: rgba(20, 12, 6, 0.75); z-index: 9999;
      display: none; justify-content: center; align-items: center; flex-direction: column;
    }
    .velo.attivo { display: flex; }
    .velo-ancora { font-size: 2.5em; margin-bottom: 12px; animation: gira 1s linear infinite; }
    @keyframes gira { to { transform: rotate(360deg); } }
    .velo-testo { color: #f4e4c1; font-family: 'Pirata One', cursive; font-size: 1.4em; letter-spacing: 1px; }

    /* Attribuzione obbligatoria (MANUALE §9). */
    .crediti-icone { text-align: center; color: rgba(255,255,255,0.75); font-size: 0.78em; margin: 18px auto 6px; }
    .crediti-icone a { color: #f4e4c1; }

    @media (max-width: 600px) {
      body { padding: 10px; }
      .header { padding: 14px; }
      .header h1 { font-size: 1.5em; }
      .section { padding: 16px; }
      .riga-campi { grid-template-columns: 1fr; }
      .voce { flex-direction: column; }
    }
  </style>
</head>

<div class="container">

<script>
  // =====================================================================
  // SEGNALAZIONI DEL LOCALE (25/10/2026)
  // =====================================================================
  // Dal menu principale, aperta a tutti: food, strumenti, drink, vino, altro.
  // Stesso server delle segnalazioni vini (Hosting/api/vdc-segnalazioni.php),
  // area "locale". Le VINO finiscono anche nelle Segnalazioni di Gestione Vini.
  // Segnarle fatte o eliminarle qui le toglie solo da questa pagina: nel
  // pannello del titolare restano finché non le lavora lui (il server lo sa
  // dall'area "locale" mandata con la richiesta). Il server qui non manda le
  // vino già lavorate o tolte, quindi non c'è "riapri" per loro.
  //
  // Il fornitore è un campo libero, con i nomi già usati come suggerimento.
  // Una segnalazione URGENTE sta sempre in cima finché è aperta.
  const API_URL = 'https://www.studio-smart.it/api/vdc-segnalazioni.php';
  const AREA = 'locale';
  const TIMEOUT_MS = 20000;

  const CATEGORIE = [
    { chiave: 'food',      etichetta: 'Food' },
    { chiave: 'strumenti', etichetta: 'Strumenti' },
    { chiave: 'drink',     etichetta: 'Drink' },
    { chiave: 'vino',      etichetta: 'Vino' },
    { chiave: 'altro',     etichetta: 'Altro' }
  ];
  // Restano del locale; le altre sono le vino, che vanno anche al titolare.
  const SOLO_LOCALE = ['food', 'strumenti', 'drink', 'altro'];
  const delTitolare = s => SOLO_LOCALE.indexOf(s.categoria) === -1;

  let segnalazioni = [];
  let inModifica = null;

  // ── Rete: stesse regole di segnalazioni.html (MANUALE §5.3, §5.4) ───
  async function fetchConRetry(url, options, tentativi = 2, timeoutMs = TIMEOUT_MS) {
    for (let i = 0; i < tentativi; i++) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, { ...options, signal: controller.signal });
        clearTimeout(timeoutId);
        return res;
      } catch (error) {
        clearTimeout(timeoutId);
        if (error.name === 'AbortError') throw error;   // mai ritentare sul timeout
        if (i === tentativi - 1) throw error;
        await new Promise(r => setTimeout(r, 800 * Math.pow(2, i)));
      }
    }
  }

  async function callAPI(azione, dati = {}, tentativi = 3) {
    let ultima = '';
    for (let i = 0; i < tentativi; i++) {
      const risposta = await fetchConRetry(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: azione, ...dati })
      });
      ultima = await risposta.text();
      try {
        return JSON.parse(ultima);
      } catch (e) {
        console.warn(`[${azione}] risposta non-JSON al tentativo ${i + 1}/${tentativi}:`, ultima.slice(0, 150));
        if (i < tentativi - 1) await new Promise(r => setTimeout(r, 1200 * (i + 1)));
      }
    }
    throw new Error('Il server ha risposto in modo inatteso. Di solito basta riprovare fra qualche secondo.');
  }

  // ── Utilità ─────────────────────────────────────────────────────────
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function dataBreve(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ''));
    return m ? `${m[3]}/${m[2]}/${m[1]}` : '';
  }

  function categoriaDi(chiave) {
    return CATEGORIE.filter(c => c.chiave === chiave)[0] || { chiave: chiave, etichetta: chiave };
  }

  function mostraVelo(testo) {
    document.getElementById('veloTesto').textContent = testo;
    document.getElementById('velo').classList.add('attivo');
  }
  function nascondiVelo() { document.getElementById('velo').classList.remove('attivo'); }

  function messaggio(testo, tipo) {
    const box = document.getElementById('messaggio');
    if (!testo) { box.innerHTML = ''; return; }
    box.innerHTML = `<div class="messaggio ${tipo}">${esc(testo)}</div>`;
    if (tipo === 'ok') setTimeout(() => { box.innerHTML = ''; }, 2500);
  }

  // Su una scrittura il timeout non vuol dire "non è successo" (MANUALE §5.3).
  function erroreLeggibile(error, scrittura) {
    const nome = error && error.name;
    if (nome === 'AbortError' || nome === 'TimeoutError') {
      return scrittura
        ? 'Il server non ha risposto entro 20 secondi. Può essere andata lo stesso: guarda l\'elenco prima di rifarla.'
        : 'Il server non ha risposto entro 20 secondi. Controlla la connessione e riprova con il tasto ricarica.';
    }
    return (error && error.message) ? error.message : 'Errore imprevisto';
  }

  /** Filtra e ordina: urgenti aperte in cima, poi le più recenti. */
  function ordinaSegnalazioni(lista, filtri) {
    const q = String(filtri.cerca || '').trim().toLowerCase();
    const inCima = s => s.urgente && s.stato === 'aperta';
    return lista.filter(s => {
      if (filtri.stato === 'aperte' && s.stato !== 'aperta') return false;
      if (filtri.stato === 'chiuse' && s.stato !== 'chiusa') return false;
      if (filtri.categoria && (delTitolare(s) ? 'vino' : s.categoria) !== filtri.categoria) return false;
      if (q && (s.testo + ' ' + (s.fornitore || '')).toLowerCase().indexOf(q) === -1) return false;
      return true;
    }).sort((a, b) =>
      (inCima(b) - inCima(a)) ||
      (a.stato === b.stato ? 0 : a.stato === 'aperta' ? -1 : 1) ||
      String(b.creato).localeCompare(String(a.creato)) ||
      String(b.id).localeCompare(String(a.id)));
  }

  // ── Disegno ─────────────────────────────────────────────────────────
  function disegnaCategorie() {
    document.getElementById('scelteCategoria').innerHTML = CATEGORIE.map((c, i) => `
      <label class="chip">
        <input type="radio" name="categoria" value="${c.chiave}" ${i === 0 ? 'checked' : ''}>
        ${c.etichetta}
      </label>`).join('');
    document.getElementById('filtroCategoria').innerHTML =
      '<option value="">Tutte</option>' +
      CATEGORIE.map(c => `<option value="${c.chiave}">${c.etichetta}</option>`).join('');
  }

  function disegnaFornitori(nomi) {
    document.getElementById('fornitoriNoti').innerHTML =
      nomi.map(f => `<option value="${esc(f)}"></option>`).join('');
  }

  function disegna() {
    const lista = ordinaSegnalazioni(segnalazioni, {
      cerca: document.getElementById('cerca').value,
      categoria: document.getElementById('filtroCategoria').value,
      stato: document.getElementById('filtroStato').value
    });
    const box = document.getElementById('elenco');
    const aperte = segnalazioni.filter(s => s.stato === 'aperta');
    const urgenti = aperte.filter(s => s.urgente).length;

    if (!lista.length) {
      box.innerHTML = `<p class="vuoto">${segnalazioni.length
        ? 'Nessuna segnalazione con questi filtri.'
        : 'Ancora nessuna segnalazione: la prima scrivila qui sopra.'}</p>`;
      return;
    }
    box.innerHTML =
      `<p class="contatori">${aperte.length} apert${aperte.length === 1 ? 'a' : 'e'}` +
      (urgenti ? ` · ${urgenti} urgent${urgenti === 1 ? 'e' : 'i'}` : '') + '</p>' +
      lista.map(voce).join('');
  }

  function voce(s) {
    const chiave = delTitolare(s) ? 'vino' : s.categoria;
    const cat = categoriaDi(chiave);
    const urgente = s.urgente && s.stato === 'aperta';
    // Le vino: solo fatta ed elimina (qui le toglie e basta, vedi in alto).
    const comandi = delTitolare(s)
      ? `<div style="white-space:nowrap;">
          <button class="btn-mini" onclick="cambiaStato('${esc(s.id)}', true)" title="Segna come fatta">
            <svg class="ico ico-sola"><use href="#i-fa-circle-check"></use></svg>
          </button>
          <button class="btn-mini pericolo" onclick="elimina('${esc(s.id)}')" title="Elimina">
            <svg class="ico ico-sola"><use href="#i-trash-can"></use></svg>
          </button>
        </div>`
      : `<div style="white-space:nowrap;">
          <button class="btn-mini" onclick="cambiaStato('${esc(s.id)}', ${s.stato === 'aperta'})"
                  title="${s.stato === 'aperta' ? 'Segna come risolta' : 'Riapri'}">
            <svg class="ico ico-sola"><use href="#${s.stato === 'aperta' ? 'i-fa-circle-check' : 'i-cycle'}"></use></svg>
          </button>
          <button class="btn-mini" onclick="apriModifica('${esc(s.id)}')" title="Modifica">
            <svg class="ico ico-sola"><use href="#i-quill"></use></svg>
          </button>
          <button class="btn-mini pericolo" onclick="elimina('${esc(s.id)}')" title="Elimina">
            <svg class="ico ico-sola"><use href="#i-trash-can"></use></svg>
          </button>
        </div>`;
    return `
      <div class="voce voce-${esc(chiave)} ${urgente ? 'urgente' : ''} ${s.stato === 'chiusa' ? 'chiusa' : ''}">
        <div class="voce-corpo">
          <div class="voce-testo">${esc(s.testo)}</div>
          <div class="voce-sotto">
            ${urgente ? '<span class="badge badge-urgente">Urgente</span>' : ''}
            <span class="badge">${esc(cat.etichetta)}</span>
            ${s.fornitore ? `<span>${esc(s.fornitore)}</span> ·` : ''}
            <span>${dataBreve(s.creato)}${s.stato === 'chiusa' ? ' · chiusa il ' + dataBreve(s.chiuso) : ''}</span>
          </div>
        </div>
        ${comandi}
      </div>`;
  }

  // ── Azioni ──────────────────────────────────────────────────────────
  async function carica() {
    mostraVelo('Carico le segnalazioni...');
    try {
      const r = await callAPI('getSegnalazioni', { area: AREA });
      nascondiVelo();
      if (r.errore) return messaggio(r.errore, 'errore');
      segnalazioni = r.segnalazioni || [];
      disegnaFornitori(r.fornitori || []);
      disegna();
    } catch (error) {
      nascondiVelo();
      console.error('getSegnalazioni:', error);
      messaggio(erroreLeggibile(error, false), 'errore');
    }
  }

  function datiForm() {
    const scelta = document.querySelector('input[name="categoria"]:checked');
    return {
      area: AREA,
      categoria: scelta ? scelta.value : CATEGORIE[0].chiave,
      testo: document.getElementById('testo').value.trim(),
      fornitore: document.getElementById('fornitore').value.trim(),
      urgente: document.getElementById('urgente').checked
    };
  }

  function pulisciForm() {
    document.getElementById('testo').value = '';
    document.getElementById('fornitore').value = '';
    document.getElementById('urgente').checked = false;
  }

  async function salva() {
    const dati = datiForm();
    if (!dati.testo) return messaggio('Scrivi che cosa manca', 'errore');
    mostraVelo(inModifica ? 'Aggiorno...' : 'Salvo...');
    try {
      const r = inModifica
        ? await callAPI('modificaSegnalazione', { id: inModifica, segnalazione: dati })
        : await callAPI('salvaSegnalazione', { segnalazione: dati });
      nascondiVelo();
      if (r.errore) return messaggio(r.errore, 'errore');
      annullaModifica();
      pulisciForm();
      messaggio(r.messaggio || 'Fatto', 'ok');
      await carica();
    } catch (error) {
      nascondiVelo();
      console.error('salvataggio:', error);
      messaggio(erroreLeggibile(error, true), 'errore');
      await carica();
    }
  }

  function apriModifica(id) {
    const s = segnalazioni.filter(x => x.id === id)[0];
    if (!s) return;
    inModifica = id;
    document.getElementById('testo').value = s.testo;
    document.getElementById('fornitore').value = s.fornitore || '';
    document.getElementById('urgente').checked = !!s.urgente;
    const radio = document.querySelector(`input[name="categoria"][value="${s.categoria}"]`);
    if (radio) radio.checked = true;
    document.getElementById('titoloForm').textContent = 'Modifica segnalazione';
    document.getElementById('btnSalvaTesto').textContent = 'Salva modifica';
    document.getElementById('btnAnnulla').hidden = false;
    document.getElementById('testo').focus();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function annullaModifica() {
    if (inModifica) pulisciForm();
    inModifica = null;
    document.getElementById('titoloForm').textContent = 'Nuova segnalazione';
    document.getElementById('btnSalvaTesto').textContent = 'Aggiungi';
    document.getElementById('btnAnnulla').hidden = true;
  }

  async function cambiaStato(id, chiudi) {
    mostraVelo(chiudi ? 'Chiudo...' : 'Riapro...');
    try {
      const r = await callAPI('chiudiSegnalazione', { id: id, chiusa: chiudi, area: AREA });
      nascondiVelo();
      if (r.errore) return messaggio(r.errore, 'errore');
      await carica();
    } catch (error) {
      nascondiVelo();
      messaggio(erroreLeggibile(error, true), 'errore');
      await carica();
    }
  }

  async function elimina(id) {
    const s = segnalazioni.filter(x => x.id === id)[0];
    if (!confirm(`🗑️ Eliminare questa segnalazione?\n\n"${s ? s.testo : ''}"\n\nSe è risolta conviene chiuderla (✔), così resta la memoria.`)) return;
    mostraVelo('Elimino...');
    try {
      const r = await callAPI('eliminaSegnalazione', { id: id, area: AREA });
      nascondiVelo();
      if (r.errore) return messaggio(r.errore, 'errore');
      if (inModifica === id) annullaModifica();
      await carica();
    } catch (error) {
      nascondiVelo();
      messaggio(erroreLeggibile(error, true), 'errore');
      await carica();
    }
  }

  document.getElementById('testo').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); salva(); }
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  }

  disegnaCategorie();
  carica();
</script>
